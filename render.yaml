services:
  - type: web
    name: hydrocast-api
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r frontend/backend/render-requirements.txt
    startCommand: uvicorn frontend.backend.dashboard_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: HYDROCAST_PROJECT_ROOT
        value: /opt/render/project/src
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: hydrocast-dashboard
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
